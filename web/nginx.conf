# Nginx del contenedor web (producción): sirve el front y reenvía /api a la API.
# El HTTPS lo pone el proxy del VPS (o Cloudflare, Caddy, etc.) delante de este contenedor.

# IP real del cliente: se confía en X-Forwarded-For solo si viene de una red privada
# (el proxy del VPS conectándose por la red de Docker). Expuesto directo a internet, se ignora.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # La API confía en un salto (trust proxy = 1): le llega solo la IP real del cliente
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    client_max_body_size 6m;   # comprobantes de hasta 5 MB
  }

  # Archivos con hash en el nombre: caché larga
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Manifiesto de la app instalable (nginx no trae el tipo de .webmanifest)
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Rutas del front (/r/…, /orden/…): siempre index.html, sin caché.
  # También /sw.js: sin caché para que cada despliegue actualice el service worker.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
