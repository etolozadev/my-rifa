# mis-rifas · producción
#   cp .env.example .env   (y completa los secretos)
#   docker compose -f docker-compose.prod.yml up -d --build
# Solo el contenedor web publica un puerto; ponle delante el proxy con HTTPS del VPS (ver README).

name: mis-rifas

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rifas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-rifas}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
      target: prod
    image: mis-rifas-api:latest
    restart: unless-stopped
    init: true # reenvía señales y recoge procesos (apagado limpio)
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-rifas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rifas}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (openssl rand -hex 32)}
      UPLOADS_DIR: /app/storage/comprobantes
      WEB_ORIGIN: ${WEB_ORIGIN:?Define WEB_ORIGIN en .env (ej. https://rifas.estebantoloza.cl)}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      # Avisos por correo al equipo (opcional): sin SMTP_URL no se envían
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-mis-rifas <no-responder@localhost>}
    volumes:
      - uploads:/app/storage # comprobantes de pago: respáldalos junto con la base
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      target: prod
    image: mis-rifas-web:latest
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  uploads:
