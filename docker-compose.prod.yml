# mis-rifas · producción en Coolify
#   Build pack: Docker Compose · Base Directory: / · Docker Compose Location: /docker-compose.prod.yml
#   Dominio: en el servicio "web" → https://rifas.estebantoloza.cl (Coolify emite el certificado)
# Coolify genera y guarda las contraseñas SERVICE_*; WEB_ORIGIN, SMTP_URL y MAIL_FROM se completan en
# Configuration > Environment Variables. Guía completa: deploy/README.md
#
# Para probarlo fuera de Coolify: docker compose -f docker-compose.prod.yml --env-file <archivo> up
# con SERVICE_PASSWORD_POSTGRES, SERVICE_HEX_64_JWT y WEB_ORIGIN definidos en el archivo.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rifas
      POSTGRES_DB: rifas
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Respaldos diarios (tarea programada en Coolify, ver deploy/README.md)
      - backups:/backups
      # Solo lectura: para incluir los comprobantes en el mismo respaldo
      - uploads:/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rifas -d rifas"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
      target: prod
    restart: unless-stopped
    init: true # reenvía señales y recoge procesos (apagado limpio)
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://rifas:${SERVICE_PASSWORD_POSTGRES}@db:5432/rifas
      JWT_SECRET: ${SERVICE_HEX_64_JWT}
      UPLOADS_DIR: /app/storage/comprobantes
      # URL pública del front (CORS, cookies y enlaces de los correos): https://rifas.estebantoloza.cl
      WEB_ORIGIN: ${WEB_ORIGIN:?}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      # Avisos por correo al equipo (opcional). Gmail: smtps://tu.correo%40gmail.com:CLAVEDEAPLICACION@smtp.gmail.com:465
      SMTP_URL: ${SMTP_URL}
      MAIL_FROM: ${MAIL_FROM:-mis-rifas <no-responder@localhost>}
    volumes:
      - uploads:/app/storage # comprobantes de pago
    depends_on:
      db:
        condition: service_healthy

  # Único servicio público: Nginx sirve el front y reenvía /api a la API por la red interna.
  # En Coolify se le asigna el dominio; no publica puertos (el proxy de Coolify llega por la red de Docker).
  web:
    build:
      context: ./web
      target: prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  uploads:
  backups:
