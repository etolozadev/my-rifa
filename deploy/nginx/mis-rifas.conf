# mis-rifas en el Nginx del servidor (plantilla: nginx-setup.sh reemplaza __DOMAIN__ y __PORT__).
# Reenvía todo al contenedor web, que sirve el front y pasa /api a la API.
# certbot --nginx agrega después el bloque HTTPS y la redirección desde HTTP.
server {
  listen 80;
  listen [::]:80;
  server_name __DOMAIN__;

  # Comprobantes de pago de hasta 5 MB
  client_max_body_size 6m;

  location / {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # La IP real del comprador (la usa el límite de reservas por IP)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
